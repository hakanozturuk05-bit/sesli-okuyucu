name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android proje iskeletini oluştur
        run: flutter create --platforms=android --project-name sesli_okuyucu --org com.sesliokuyucu uygulama

      - name: Kodlarımızı kopyala
        run: |
          cp -r lib uygulama/
          cp pubspec.yaml uygulama/pubspec.yaml

      - name: Android ayarlarını düzelt
        working-directory: uygulama
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle
          fi
          echo "---- Ayar dosyası kontrolü ----"
          grep -n -i "minSdk\|minify\|shrink" android/app/build.gradle* || true

      - name: Paketleri indir
        working-directory: uygulama
        run: flutter pub get

      - name: APK derle
        working-directory: uygulama
        run: flutter build apk --release --no-shrink

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: sesli-okuyucu-apk
          path: uygulama/build/app/outputs/flutter-apk/app-release.apk
